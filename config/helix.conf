# RGB underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=210
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=35
# Speed 1 gives the native breathe effect an approximately 12-second cycle.
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=1
CONFIG_ZMK_HELIX_PROFILE_RGB=y
CONFIG_ZMK_IDLE_TIMEOUT=60000

# Battery reporting. The built-in OLED status screen displays the local half's
# battery percentage; split battery fetching/proxying remains enabled for hosts.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=30
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# OLED status screen
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_SYSTEM=y
# Keep the display visible while validating battery reporting. This consumes
# more battery than blanking the OLED while idle.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_I2C=y
CONFIG_SSD1306=y
CONFIG_LV_Z_VDB_SIZE=64
CONFIG_LV_DPI_DEF=148
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_COLOR_DEPTH_1=y

# Bluetooth radio power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
